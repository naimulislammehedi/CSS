<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Grid-Native Admin Dashboard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="dashboard">

    <!-- sidebar -->
     <aside class="sidebar">
      <h2>Dashboard</h2>
      <nav>
        <a href="#">Overview</a>
        <a href="#">Users</a>
        <a href="#">Reports</a>
        <a href="#">Settings</a>
      </nav>
     </aside>

     <!-- Header -->
      <header class="header">
        <h1>Admin Panel</h1>
        <div class="notification">🔔</div>
      </header>

      <!-- KPI Section -->
       <section class="kpi">
        <div class="card">Revenue</div>
        <div class="card">Users</div>
        <div class="card">Orders</div>
       </section>

       <!-- Chart -->
        <section class="chart">
          Chart Area
        </section>

        <!-- Table -->
         <section class="table">
          Data Table
         </section>
  </div>
</body>
</html>
